# Portainer stack template — canonical Docker + CloudPanel + R2 deployment
#
# Recommended use:
# 1) In Portainer, deploy this as a Stack from the project repository/worktree
#    so the `build` context can access `Dockerfile`, `src/`, `views/`, etc.
# 2) Set the environment variables in Portainer before deploy.
# 3) Keep CloudPanel/Nginx on the host as the HTTPS reverse proxy to 127.0.0.1:3000.
#
# Canonical architecture:
# - App runtime: Docker / Portainer
# - Reverse proxy + TLS: CloudPanel Nginx on host
# - Primary file storage: Cloudflare R2
# - Public anti-bot: Cloudflare Turnstile
# - Admin protection: username + password + hCaptcha + session cookie
#
# Important operator note:
# - This canonical R2 stack persists only the metadata catalog (`files.json`).
# - Local blob storage is intentionally NOT mounted here.
# - Before first deploy, seed the host path below with the repo's `src/data/files.json`.
#   Example on the Docker host:
#     mkdir -p /opt/download-hub/data
#     cp /path/to/repo/src/data/files.json /opt/download-hub/data/files.json

version: "3.9"

services:
  app:
    image: ${DOWNLOAD_HUB_IMAGE:-download-hub:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: download-hub-app
    restart: unless-stopped

    ports:
      # Host-only binding: CloudPanel Nginx should proxy to this port.
      - "127.0.0.1:${APP_PORT:-3000}:3000"

    environment:
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-production}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_HOSTNAME: ${APP_HOSTNAME}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}

      DOWNLOAD_TOKEN_SECRET: ${DOWNLOAD_TOKEN_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dl888_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1200}
      DOWNLOAD_TOKEN_TTL_SECONDS: ${DOWNLOAD_TOKEN_TTL_SECONDS:-120}
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-20kb}
      ALLOWED_LOCALES: ${ALLOWED_LOCALES:-vi,en}

      FILES_INDEX_PATH: /app/src/data/files.json
      FILES_STORAGE_PATH: ${FILES_STORAGE_PATH:-./storage/files}

      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      TURNSTILE_ACTION: ${TURNSTILE_ACTION:-download_gate}

      HCAPTCHA_ENABLED: ${HCAPTCHA_ENABLED:-true}
      HCAPTCHA_SITE_KEY: ${HCAPTCHA_SITE_KEY}
      HCAPTCHA_SECRET_KEY: ${HCAPTCHA_SECRET_KEY}
      HCAPTCHA_EXPECTED_HOSTNAME: ${HCAPTCHA_EXPECTED_HOSTNAME}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-3600}
      ADMIN_COOKIE_NAME: ${ADMIN_COOKIE_NAME:-dl888_admin_sess}

      R2_ENABLED: ${R2_ENABLED:-true}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}

      USE_X_ACCEL_REDIRECT: ${USE_X_ACCEL_REDIRECT:-false}
      X_ACCEL_INTERNAL_PREFIX: ${X_ACCEL_INTERNAL_PREFIX:-/protected-downloads}

      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-300}
      RATE_LIMIT_MAX_ATTEMPTS: ${RATE_LIMIT_MAX_ATTEMPTS:-20}
      LOG_REQUESTS: ${LOG_REQUESTS:-false}

      # Optional compatibility path only. Leave empty in canonical deployments.
      ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN:-}

    volumes:
      # Persist only the metadata catalog in canonical R2 mode.
      - type: bind
        source: ${DOWNLOAD_HUB_DATA_DIR:-/opt/download-hub/data}
        target: /app/src/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp:size=64m,mode=1777

    # Resource caps are kept aligned with docker-compose.yml.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M

networks:
  default:
    name: download-hub-net
