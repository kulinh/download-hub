[Service]
User=dlhub
Group=dlhub
StateDirectory=dlhub
Environment=HOME=/var/lib/dlhub
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ReadWritePaths=/opt/download-hub/data /opt/download-hub/src/data /opt/download-hub/storage
# Deploys run as root may leave root-owned files here; fix on every start.
ExecStartPre=+/bin/chown -hR dlhub:dlhub /opt/download-hub/data /opt/download-hub/src/data /opt/download-hub/storage
