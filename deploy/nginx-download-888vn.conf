# Nginx config for download.888vn.net — CloudPanel deployment
# Place this in the CloudPanel site's "Vhost" or custom nginx include.
# CloudPanel manages HTTPS termination and Let's Encrypt automatically;
# this file focuses on the reverse-proxy + hotlink-protection logic.
#
# Key design decisions:
#   - /protected-downloads/ is internal-only (X-Accel-Redirect offload)
#   - Hotlink protection via $valid_referers + token-bound endpoint
#   - All download paths enforce no caching, no search-engine indexing
#   - Static assets served by Node (kept simple for CloudPanel)

server {
    listen 80;
    server_name download.888vn.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name download.888vn.net;

    # CloudPanel manages SSL cert paths — adjust paths to match your site
    # ssl_certificate     /etc/nginx/ssl-certificates/download.888vn.net.crt;
    # ssl_certificate_key /etc/nginx/ssl-certificates/download.888vn.net.key;

    # CloudPanel typically injects SSL directives via include; if using manual
    # vhost, uncomment and set the actual cert/key paths above.

    client_max_body_size 100k;

    # ── Internal download offload (X-Accel-Redirect) ────────────────────────
    # Only reachable by the Node process via the X-Accel-Redirect header.
    # Never served directly from the internet.
    location /protected-downloads/ {
        internal;

        # Absolute path to the storage/files directory on disk.
        # Adjust to match your actual CloudPanel webroot layout.
        alias /home/cloudpanel/htdocs/download-888vn/storage/files/;

        # Pass filename and type set by Node
        add_header Content-Disposition $upstream_http_content_disposition always;
        add_header Content-Type        $upstream_http_content_type        always;

        # Security: no caching, no indexing, no cross-origin
        add_header Cache-Control              "private, no-store, max-age=0" always;
        add_header X-Robots-Tag               "noindex, nofollow"            always;
        add_header Cross-Origin-Resource-Policy "same-origin"                always;

        # Defence-in-depth: block all but same-origin referers at Nginx level.
        # The token-based check in Node is the primary guard; this is secondary.
        valid_referers none blocked server_names ~download\.888vn\.net;
        if ($invalid_referer) {
            return 403;
        }
    }

    # ── Block direct access to storage path if webroot overlap ──────────────
    location ~* ^/storage/ {
        deny all;
        return 403;
    }

    # ── Block dot-files ──────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 403;
    }

    # ── Robots & security.txt ────────────────────────────────────────────────
    # NOTE: These files are also served by the Node app (see src/routes/site.js).
    # The nginx locations below serve them directly from disk as a performance
    # optimisation and bypass, using the CloudPanel layout where app source lives
    # under the `app/` subdirectory:
    #   webroot: /home/cloudpanel/htdocs/download-888vn/app
    #   public/: /home/cloudpanel/htdocs/download-888vn/app/public
    # Remove or comment out these blocks if you prefer Node-only serving.
    location = /robots.txt {
        root /home/cloudpanel/htdocs/download-888vn/app/public;
        try_files /robots.txt =404;
        access_log off;
    }

    location = /.well-known/security.txt {
        root /home/cloudpanel/htdocs/download-888vn/app/public;
        try_files /.well-known/security.txt =404;
        access_log off;
    }

    # ── Reverse proxy to Node.js ─────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts: generous for file streaming, tight for API
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        # Disable buffering for download streams
        proxy_buffering off;
    }

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/download-888vn.access.log;
    error_log  /var/log/nginx/download-888vn.error.log warn;
}
