# Nginx config for download.888vn.net — CloudPanel + Docker deployment
# ── Deployment model ─────────────────────────────────────────────────────────
#   - App runs in Docker container on 127.0.0.1:3000
#   - CloudPanel manages HTTPS / Let's Encrypt (no SSL directives needed here)
#   - This file covers: reverse-proxy, X-Accel-Redirect (local disk fallback),
#     and security headers. R2 streaming is handled by Node/Docker; no Nginx
#     internal location is needed when R2_ENABLED=true.
#
# Import/paste this into CloudPanel site's "Vhost" custom config block.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name download.888vn.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name download.888vn.net;

    # CloudPanel manages SSL cert paths automatically via Let's Encrypt.
    # If using manual vhost, uncomment and set actual cert/key paths:
    # ssl_certificate     /etc/nginx/ssl-certificates/download.888vn.net.crt;
    # ssl_certificate_key /etc/nginx/ssl-certificates/download.888vn.net.key;

    client_max_body_size 100k;

    # ── X-Accel-Redirect internal location ──────────────────────────────────
    # Only needed when R2_ENABLED=false (local disk fallback).
    # The Docker container must mount storage/files at a path accessible to Nginx,
    # OR use a shared volume. When R2_ENABLED=true, this block is unused.
    #
    # Uncomment and adjust alias if using local disk mode:
    # location /protected-downloads/ {
    #     internal;
    #     alias /path/to/download-hub/storage/files/;
    #     add_header Content-Disposition $upstream_http_content_disposition always;
    #     add_header Content-Type        $upstream_http_content_type        always;
    #     add_header Cache-Control       "private, no-store, max-age=0"     always;
    #     add_header X-Robots-Tag        "noindex, nofollow"                always;
    #     add_header Cross-Origin-Resource-Policy "same-origin"             always;
    # }

    # ── Block dot-files ──────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 403;
    }

    # ── Robots & security.txt (served by Node in Docker) ────────────────────
    # Node container handles these; no static-file aliases needed.
    # If you want Nginx to serve them directly, uncomment and set path to
    # the mounted public/ directory:
    # location = /robots.txt {
    #     root /path/to/download-hub/public;
    #     try_files /robots.txt =404;
    #     access_log off;
    # }
    # location = /.well-known/security.txt {
    #     root /path/to/download-hub/public;
    #     try_files /.well-known/security.txt =404;
    #     access_log off;
    # }

    # ── Reverse proxy to Docker container ───────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Connection keep-alive
        proxy_set_header   Connection        "";

        # Timeouts: generous for R2 streaming, tight for API
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        # Disable buffering for download streams (R2 or local)
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/download-888vn.access.log;
    error_log  /var/log/nginx/download-888vn.error.log warn;
}
