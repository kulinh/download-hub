services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: download-hub-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      FILES_INDEX_PATH: /app/data/files.json
    volumes:
      - ${DOWNLOAD_HUB_DATA_DIR:-/opt/download-hub/data}:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
