# docker-compose.yml — Portainer-friendly deployment for download-hub
# ── Usage ────────────────────────────────────────────────────────────────────
#   1. Copy .env.example → .env and fill all required values.
#   2. docker compose up -d
#   OR import this file directly into Portainer as a Stack.
#
# ── Architecture ────────────────────────────────────────────────────────────
#   - App container: Node.js 22 Alpine (non-root appuser)
#   - Storage: Cloudflare R2 (S3-compatible). No local file blob volume needed.
#   - Reverse proxy: CloudPanel Nginx on host (NOT in this stack)
#   - Captcha: Cloudflare Turnstile (public flow) + hCaptcha (admin panel)
#
# ── CloudPanel Nginx reverse-proxy note ─────────────────────────────────────
#   Nginx on the host proxies port 3000.
#   Set TRUST_PROXY=loopback in .env.
#   Container does NOT expose TLS — that is CloudPanel's job.
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  app:
    image: download-hub:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: download-hub-app
    restart: unless-stopped
    ports:
      # Host-only binding: only CloudPanel Nginx can reach the app
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    volumes:
      # files.json metadata catalog (writable at runtime for admin sync)
      - ./src/data:/app/src/data
      # Local storage — only used in dev/fallback; R2 is primary in production
      - ./storage/files:/app/storage/files:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Least-privilege resource caps
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M

networks:
  default:
    name: download-hub-net
